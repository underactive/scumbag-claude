name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release binary
        run: make bundle

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign embedded frameworks
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          FWPATH=".build/release/Scumbag Claude.app/Contents/Frameworks/Sparkle.framework"
          # Sign inner components inside-out, preserving embedded entitlements
          codesign --force --options runtime --preserve-metadata=entitlements \
            --sign "$SIGNING_IDENTITY" "$FWPATH/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --options runtime --preserve-metadata=entitlements \
            --sign "$SIGNING_IDENTITY" "$FWPATH/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime --preserve-metadata=entitlements \
            --sign "$SIGNING_IDENTITY" "$FWPATH/Versions/B/Updater.app"
          codesign --force --options runtime --preserve-metadata=entitlements \
            --sign "$SIGNING_IDENTITY" "$FWPATH/Versions/B/Autoupdate"
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$FWPATH"

      - name: Sign app bundle
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime \
            --sign "$SIGNING_IDENTITY" \
            ".build/release/Scumbag Claude.app"
          codesign --verify --deep --strict ".build/release/Scumbag Claude.app"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          ditto -c -k --keepParent ".build/release/Scumbag Claude.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple ".build/release/Scumbag Claude.app"

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Scumbag Claude" \
            -srcfolder ".build/release/Scumbag Claude.app" \
            -ov \
            -format UDZO \
            ".build/release/Scumbag-Claude-${{ steps.version.outputs.tag }}.dmg"

      - name: Download Sparkle tools
        run: |
          set -e
          SPARKLE_VERSION="2.9.0"
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle-tools
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools

      - name: Sign DMG with EdDSA and update appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_CLEAN="${VERSION#v}"
          DMG_PATH=".build/release/Scumbag-Claude-${VERSION}.dmg"
          DMG_SIZE=$(stat -f%z "$DMG_PATH")
          DMG_URL="https://github.com/underactive/scumbag-claude/releases/download/${VERSION}/Scumbag-Claude-${VERSION}.dmg"

          # EdDSA signature via sign_update (key piped via --ed-key-file -, -p for raw signature)
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle-tools/bin/sign_update --ed-key-file - -p "$DMG_PATH")
          if [ -z "$SIGNATURE" ]; then
            echo "Error: Failed to generate EdDSA signature"
            exit 1
          fi

          # Prepare gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            cd /tmp/gh-pages
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cd -
          fi

          # Write the new appcast item to a temp file
          printf '%s\n' \
            '        <item>' \
            "            <title>Version ${VERSION_CLEAN}</title>" \
            "            <pubDate>$(date -R)</pubDate>" \
            "            <sparkle:version>${VERSION_CLEAN}</sparkle:version>" \
            "            <sparkle:shortVersionString>${VERSION_CLEAN}</sparkle:shortVersionString>" \
            '            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>' \
            "            <enclosure url=\"${DMG_URL}\" length=\"${DMG_SIZE}\" type=\"application/octet-stream\" sparkle:edSignature=\"${SIGNATURE}\" />" \
            '        </item>' > /tmp/appcast_item.xml

          if [ ! -f /tmp/gh-pages/appcast.xml ]; then
            # Create new appcast with the item already inside
            { printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
                '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' \
                '    <channel>' \
                '        <title>Scumbag Claude</title>'
              cat /tmp/appcast_item.xml
              printf '%s\n' '    </channel>' '</rss>'
            } > /tmp/gh-pages/appcast.xml
          else
            # Insert item before </channel> in existing appcast
            python3 -c "
          c = open('/tmp/gh-pages/appcast.xml').read()
          i = open('/tmp/appcast_item.xml').read()
          open('/tmp/gh-pages/appcast.xml', 'w').write(c.replace('</channel>', i + '</channel>'))
          "
          fi

          cd /tmp/gh-pages
          git add appcast.xml
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Update appcast for ${VERSION}"
          git push origin HEAD:gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Scumbag Claude ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: .build/release/Scumbag-Claude-${{ steps.version.outputs.tag }}.dmg

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
