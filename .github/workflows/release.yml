name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: make bundle

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create zip archive
        run: |
          cd .build/release
          zip -r "Scumbag-Claude-${{ steps.version.outputs.tag }}.zip" "Scumbag Claude.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Scumbag Claude ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: .build/release/Scumbag-Claude-${{ steps.version.outputs.tag }}.zip
